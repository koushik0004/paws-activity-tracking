services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paws-buddy-web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - EVAL_MODE=${EVAL_MODE:-true}
      - DEVICE=${DEVICE:-cpu}
      - TEST_VIDEO_PATH=${TEST_VIDEO_PATH:-data/dog-1.mp4}
      - LIVE_CAMERA_INDEX=${LIVE_CAMERA_INDEX:-0}
    env_file:
      - path: .env
        required: false
    volumes:
      # Mount current workspace into container for live file syncing / hot reload
      - .:/app
      # Isolate in-container virtual environment and caches from host filesystem
      - /app/.venv
      - /app/__pycache__
