[project]
name = "paws-buddy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "koushik0004", email = "koushik.sadhukhan0004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "scikit-learn>=1.9.1",
    "ultralytics>=8.4.218",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
paws-buddy = "paws_buddy:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
